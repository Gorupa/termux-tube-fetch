<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFetch | Edge Extractor</title>
    <style>
        /* Termux / Hacker Aesthetic */
        :root {
            --bg-color: #0d0d12;
            --surface: #16161e;
            --primary: #00ffcc; /* Terminal Cyan/Green */
            --text-main: #e0e0e0;
            --text-muted: #6c757d;
            --border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Input Area */
        .input-box {
            background: var(--surface);
            border: 1px solid #2d2d3b;
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            transition: border-color 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .prompt {
            color: var(--primary);
            margin-right: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        input::placeholder { color: #4a4a5a; }

        button {
            width: 100%;
            background: var(--primary);
            color: #000000;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: var(--border-radius);
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }

        button:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        button:disabled {
            background: #2d2d3b;
            color: #6c757d;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Output Console */
        .result-console {
            margin-top: 24px;
            background: var(--surface);
            padding: 20px;
            border: 1px dashed var(--primary);
            border-radius: var(--border-radius);
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .status-text {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .status-text.error { color: #ff3366; }

        .btn-link {
            display: block;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            text-align: center;
            padding: 14px;
            text-decoration: none;
            margin-bottom: 10px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-link:hover {
            background: var(--primary);
            color: #000000;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #2d2d3b;
            padding-top: 20px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover { text-decoration: underline; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="header">
            <h1 class="title">MediaFetch</h1>
            <p class="subtitle">Ad-Free • Open Source • Unthrottled</p>
        </div>

        <div class="input-box">
            <span class="prompt">~/url$</span>
            <input type="url" id="youtubeUrl" placeholder="Paste link to extract..." autocomplete="off">
        </div>
        
        <button id="downloadBtn">Initialize Payload ⚡</button>

        <div id="result" class="result-console">
            </div>

        <div class="footer">
            <p>Powered by <a href="https://github.com/gorupa" target="_blank">Gaurav (@gorupa)</a></p>
        </div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const urlInput = document.getElementById('youtubeUrl');
        const resultDiv = document.getElementById('result');

        // Using a public API to bypass YouTube Bot Blocks without needing a backend
        const PUBLIC_API_URL = 'https://co.wuk.sh/api/json';

        downloadBtn.addEventListener('click', async () => {
            const videoUrl = urlInput.value.trim();
            
            if (!videoUrl) {
                alert("Please provide a valid target URL.");
                return;
            }

            // Terminal UI Loading State
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<p class="status-text"><span class="blink">_</span> Executing extraction protocol...</p>`;
            downloadBtn.disabled = true;
            downloadBtn.innerText = 'Extracting...';

            try {
                // Requesting MP4 Video from public API
                const response = await fetch(PUBLIC_API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        url: videoUrl,
                        vQuality: "max",
                        isAudioOnly: false
                    })
                });

                const data = await response.json();

                if (data.url) {
                    resultDiv.innerHTML = `
                        <p class="status-text" style="color: #00ffcc;">> Extraction Successful.</p>
                        <a href="${data.url}" target="_blank" class="btn-link">⬇️ Download Media</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="status-text error">> Error: Payload rejected. Target may be restricted.</p>`;
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = `<p class="status-text error">> Fatal Error: Connection refused by target node.</p>`;
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerText = 'Initialize Payload ⚡';
            }
        });
    </script>
</body>
</html>
