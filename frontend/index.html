<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFetch | Clean & Fast</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="badge-container">
                <span class="badge badge-adfree"><span class="anim-spin">✨</span> 100% Ad-Free</span>
                <span class="badge badge-opensource">🛠️ Open Source</span>
            </div>
            <h1>MediaFetch <span class="anim-wave inline-emoji">👋</span></h1>
            <p class="subtitle">Direct, unthrottled media extraction. No fluff.</p>
        </header>

        <main class="main-card elevation-2">
            <div class="input-container">
                <input type="url" id="youtubeUrl" placeholder="🔗 Paste YouTube link here..." autocomplete="off">
            </div>
            
            <button id="downloadBtn" class="btn-primary anim-float-hover">
                <span class="btn-text">Extract Media 🚀</span>
            </button>

            <div id="result" class="result-area hidden">
                </div>
        </main>

        <footer class="app-footer">
            <p>Crafted with <span class="anim-pulse" style="display:inline-block; color: #ff4757;">❤️</span> by <a href="https://github.com/gorupa" target="_blank" class="github-link"><strong>Gaurav (@gorupa)</strong></a></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
